# Render Blueprint: one always-on web service (WebSocket + YOLO need a long-running process).
services:
  - type: web
    name: nearby
    runtime: python
    plan: standard            # 1 CPU / 2 GB: torch + YOLO do not fit in 512 MB
    region: frankfurt
    buildCommand: >-
      pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      pip uninstall -y opencv-python &&
      pip install --force-reinstall --no-deps opencv-python-headless &&
      python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /state
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: USE_REAL_YOLO
        value: "1"
      - key: USE_REAL_COSMOS
        value: "1"
      - key: COSMOS_MODE
        value: yolo
      - key: YOLO_DEVICE
        value: cpu
