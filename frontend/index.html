<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Sight</title>
<style>
  :root { --bg:#0b0d10; --fg:#e8eaed; --muted:#8a919a; --accent:#5ad1a3; --warn:#f2b134; --urgent:#ff5c5c; --card:#14181d; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid #222; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px }
  header .sp { flex:1 }
  button, select, input { font:inherit; background:var(--card); color:var(--fg); border:1px solid #2a3038; border-radius:8px; padding:8px 12px; }
  button.primary { background:var(--accent); color:#06231a; border-color:transparent; font-weight:600 }
  main { display:grid; grid-template-columns: 3fr 2fr; gap:14px; padding:14px 16px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr } }
  .stage { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3 }
  .stage video, .stage canvas { position:absolute; inset:0; width:100%; height:100% }
  .stage .flash { position:absolute; inset:0; pointer-events:none; box-shadow: inset 0 0 0 0 var(--urgent); transition: box-shadow .15s }
  .stage.hazard .flash { box-shadow: inset 0 0 0 18px var(--urgent) }
  .stage .tint { position:absolute; inset:0; pointer-events:none; background:var(--urgent); opacity:0; transition: opacity .3s }
  .stage.tinted .tint { opacity:.28; transition: opacity .05s }
  .subtitle { position:absolute; left:0; right:0; bottom:0; padding:10px 16px; text-align:center; font-size:17px; line-height:1.3;
              color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.75) 35%); text-shadow:0 1px 3px #000; pointer-events:none; min-height:44px }
  .subtitle:empty { display:none }
  .hud { position:absolute; left:10px; top:10px; background:rgba(0,0,0,.55); padding:6px 10px; border-radius:8px; font-size:13px; color:var(--muted) }
  .panel { background:var(--card); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:0 }
  .said { font-size:22px; min-height:60px; padding:10px 12px; border-radius:10px; background:#0f1317; border-left:4px solid var(--accent) }
  .said.warn { border-color:var(--warn) } .said.urgent { border-color:var(--urgent) }
  .caption { color:var(--muted); font-size:14px }
  .row { display:flex; gap:8px } .row input { flex:1 }
  .log { overflow:auto; max-height:40vh; display:flex; flex-direction:column; gap:6px; font-size:14px }
  .log .item { padding:8px 10px; border-radius:8px; background:#0f1317; display:flex; gap:8px; align-items:flex-start }
  .log .k { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); min-width:56px; padding-top:3px }
  .log .k.urgent{color:var(--urgent)} .log .k.warn{color:var(--warn)} .log .k.answer{color:var(--accent)}
  .log video { width:160px; border-radius:6px; margin-left:auto }
</style>
</head>
<body>
<header>
  <h1>👁 Second Sight</h1>
  <span class="caption" id="status">camera off</span>
  <span class="sp"></span>
  <label class="caption">voice
    <select id="persona"><option value="calm">Calm</option><option value="attenborough">Attenborough</option></select>
  </label>
  <button id="mute">🔊 sound on</button>
  <button id="usevideo" title="Play a first-person video as the person's eyes">🎞 Use video</button>
  <input type="file" id="vfile" accept="video/*" hidden>
  <button id="pausebtn" hidden>⏸ Pause</button>
  <button id="stopbtn" hidden>⏹ Stop</button>
  <button class="primary" id="start">Start camera</button>
</header>

<main>
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="tint"></div>
    <div class="flash"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="hud" id="hud">—</div>
  </div>

  <div class="panel">
    <div class="said" id="said">…</div>
    <div class="caption" id="caption">no scene description yet</div>
    <form class="row" id="askform">
      <input id="q" placeholder="where are my keys?  ·  what do you see?" autocomplete="off">
      <button class="primary">Ask</button>
    </form>
    <div class="log" id="log"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), ctx = overlay.getContext('2d');
let ws, sending = false, muted = false;

// ---------- audio: panned earcon, then speech  (owner: C) ----------------------------
// Browser speechSynthesis can't be routed through Web Audio, so direction comes from a short
// panned tone played just before the sentence; the voice itself is centre.
// Best voices are Edge's "Natural" ones (online) — run the demo in Edge. Falls back to Chrome's
// Google voices, then Windows' offline voices, so it never goes silent. ?voice=<name> overrides.
const AC = new (window.AudioContext || window.webkitAudioContext)();
const VOICE_PREFS = {
  calm:         ['Sonia Online (Natural)', 'Libby Online (Natural)', 'Google UK English Female', 'Hazel', 'Susan'],
  attenborough: ['Thomas Online (Natural)', 'Ryan Online (Natural)', 'Google UK English Male', 'George', 'Daniel'],
};
const VOICE_STYLE = { calm: { rate: 1.0, pitch: 1.0 }, attenborough: { rate: 0.88, pitch: 0.9 } };
let voices = [];
let voicesShown = false;
function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  console.log('voices:', voices.map(v => v.name));
  if (!voicesShown) {
    voicesShown = true;
    const natural = voices.filter(v => /Natural|Google/.test(v.name)).length;
    logItem('voice', `calm: ${pickVoice('calm')?.name} · documentary: ${pickVoice('attenborough')?.name} · ${voices.length} voices, ${natural} natural`);
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
function pickVoice(persona) {
  const forced = new URLSearchParams(location.search).get('voice');
  for (const want of [forced, ...(VOICE_PREFS[persona] || VOICE_PREFS.calm)].filter(Boolean)) {
    const v = voices.find(v => v.name.includes(want));
    if (v) return v;
  }
  return voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en')) || null;
}

// info: soft two-note chime (120 ms). urgent: 250 ms square wave, low-passed so it's alarming, not harsh.
function earcon(side, urgency) {
  if (muted) return 0;
  const t = AC.currentTime, urgent = urgency === 'urgent', dur = urgent ? 0.25 : 0.12;
  const p = AC.createStereoPanner(); p.pan.value = side === 'left' ? -1 : side === 'right' ? 1 : 0;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(urgent ? 0.25 : 0.35, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = urgent ? 2400 : 6000;
  g.connect(lp).connect(p).connect(AC.destination);
  const o = AC.createOscillator(); o.type = urgent ? 'square' : 'sine';
  if (urgent) { o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(660, t + dur / 2); }
  else { o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + dur / 2); }
  o.connect(g); o.start(t); o.stop(t + dur + 0.02);
  return dur * 1000;
}

// ---------- speech manager: ONE voice at a time, decided by priority ------------------
//   3 answer — reply to the user's own question. Top: nothing interrupts it.
//   2 urgent — hazard. Cuts into warn/info. During an answer (or while waiting for one) it plays
//              only its panned tone at once, and its words right after the answer.
//   1 warn   — something close.
//   0 info   — chatter / scene descriptions. Only into silence; never queued.
// Before this, each line decided for itself and warnings, chatter and answers overlapped.
const PRIO = { answer: 3, urgent: 2, warn: 1, info: 0 };
const HELD_MAX_AGE_MS = 6000;          // a held hazard older than this is stale; a fresh one will come
const CHATTER_AFTER_URGENT_MS = 2000;  // a breath after a warning before any chatter
const audioCache = new Map();          // url -> decoded buffer (hazard lines repeat, so replays are instant)
let current = null;                    // the natural-voice clip playing now
let playing = null;                    // { prio } of the line being spoken (tone included), else null
let playId = 0;                        // bumped on every cut; callbacks from a cut line are ignored
let awaitingAnswer = false;            // user asked; answer not back yet
let held = null;                       // { item, t }: hazard waiting for the answer to finish
let lastUrgentAt = 0;

function silence() { playId++; playing = null; speechSynthesis.cancel(); if (current) { try { current.stop(); } catch (e) {} current = null; } }
function stopAll() { silence(); held = null; }

// ElevenLabs lines arrive as an audio_url; played through Web Audio so the VOICE itself is panned.
async function playNatural(url, side, id, onEnd) {
  let buf = audioCache.get(url);
  if (!buf) { buf = await AC.decodeAudioData(await (await fetch(url)).arrayBuffer()); audioCache.set(url, buf); }
  if (id !== playId) return;                                             // cut while we were loading
  const src = AC.createBufferSource(); src.buffer = buf;
  const p = AC.createStereoPanner(); p.pan.value = side === 'left' ? -0.7 : side === 'right' ? 0.7 : 0;
  src.connect(p).connect(AC.destination);
  src.onended = () => { if (current === src) current = null; onEnd(); };
  current = src; src.start();
}
function speakBrowser(text, urgent, onEnd) {
  const persona = $('persona').value;                                    // read now, so the toggle is live
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(persona); if (v) { u.voice = v; u.lang = v.lang; }
  const st = VOICE_STYLE[persona] || VOICE_STYLE.calm;
  u.rate = urgent ? 1.2 : st.rate; u.pitch = urgent ? 1.0 : st.pitch;
  u.onend = u.onerror = onEnd;
  speechSynthesis.speak(u);
}

function finished(id) { if (id === playId) { playing = null; flushHeld(); } }
function flushHeld() {
  if (!held || awaitingAnswer || playing || muted) return;
  const h = held; held = null;
  if (Date.now() - h.t < HELD_MAX_AGE_MS) play(h.item);
}
function play(item) {
  silence();
  const id = playId;
  playing = { prio: PRIO[item.urgency] ?? 0 };
  if (item.urgency === 'urgent') lastUrgentAt = Date.now();
  show(item.text, item.urgency === 'answer' ? 'info' : item.urgency);
  if (item.urgency !== 'answer') logItem(item.urgency, item.text);     // the log shows what was actually said
  const toneMs = earcon(item.side, item.urgency);
  // Chrome sometimes never fires onend; without this a stuck line would block everything below it.
  setTimeout(() => finished(id), toneMs + 2500 + 110 * item.text.length);
  setTimeout(async () => {                                               // tone first, then the voice
    if (id !== playId) return;
    if (item.audioUrl) {
      try { await playNatural(item.audioUrl, item.side, id, () => finished(id)); return; }
      catch (e) { console.warn('natural voice failed', e); }
    }
    if (id === playId) speakBrowser(item.text, item.urgency === 'urgent', () => finished(id));  // no key / offline
  }, toneMs + 20);
}

// The one entry point. Returns true if the line will be spoken now.
function speak(text, side, urgency, audioUrl) {
  if (!text || muted) return false;
  const item = { text, side, urgency, audioUrl };
  const p = PRIO[urgency] ?? 0;
  if (urgency !== 'answer' && (awaitingAnswer || playing?.prio === PRIO.answer)) {
    if (urgency === 'urgent') { earcon(side, 'urgent'); held = { item, t: Date.now() }; }  // beep now, words after
    return false;                                                        // chatter during a question: dropped
  }
  if (playing && p < playing.prio) return false;                        // never talk over something more important
  if (playing && p === playing.prio && p < PRIO.urgent) return false;   // same-level chatter: let it finish
  if (p < PRIO.urgent && Date.now() - lastUrgentAt < CHATTER_AFTER_URGENT_MS) return false;
  play(item);                                                            // more important (or a newer hazard): take over
  return true;
}
function show(text, urgency) { const s = $('said'); s.textContent = text; s.className = 'said ' + (urgency || ''); }
function logItem(kind, text, clip) {
  const d = document.createElement('div'); d.className = 'item';
  d.innerHTML = `<span class="k ${kind}">${kind}</span><span>${text}</span>` + (clip ? `<video src="${clip}" controls muted></video>` : '');
  $('log').prepend(d);
}

// ---------- camera → websocket -----------------------------------------------------
// videoUrl given → a first-person video plays as the person's eyes (looped); else the live camera.
// Everything downstream (frames → detect → speech, memory, ask) is identical either way.
async function start(videoUrl) {
  await AC.resume();
  if (videoUrl) {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());   // switching off the webcam
    video.srcObject = null; video.src = videoUrl; video.loop = true; video.muted = true;
  } else {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 } }, audio: false });
    video.srcObject = stream;
  }
  await video.play();
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  if (!ws || ws.readyState > 1) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/frames`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => pump();
    ws.onmessage = e => onResult(JSON.parse(e.data));
    ws.onclose = () => $('status').textContent = 'disconnected';
  }
  $('status').textContent = videoUrl ? 'live · video as eyes' : 'live · camera';
  $('start').disabled = true;
  $('pausebtn').hidden = $('stopbtn').hidden = false; $('pausebtn').textContent = '⏸ Pause';
}
// Pause freezes the feed: no frames are sent, so nothing new is detected or said. Stop ends the session.
function togglePause() {
  if (video.paused) { video.play(); $('pausebtn').textContent = '⏸ Pause'; $('status').textContent = 'live'; }
  else { video.pause(); stopAll(); $('pausebtn').textContent = '▶ Resume'; $('status').textContent = 'paused'; }
}
function stopSession() {
  video.pause();
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  video.removeAttribute('src'); video.load();
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  sending = false; stopAll();
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  $('pausebtn').hidden = $('stopbtn').hidden = true;
  $('start').disabled = false; $('status').textContent = 'stopped';
}
// 400 ms translucent red wash over the video on every hazard frame (re-armed while the hazard persists)
let tintTimer = null;
function hazardTint() {
  $('stage').classList.add('tinted');
  clearTimeout(tintTimer);
  tintTimer = setTimeout(() => $('stage').classList.remove('tinted'), 400);
}
// latest scene caption: subtitle bar on the video + the line under "said"
function setCaption(text) { $('subtitle').textContent = text; $('caption').textContent = text; }
const off = document.createElement('canvas'); const octx = off.getContext('2d');
function pump() {
  if (!ws || ws.readyState !== 1) return;
  if (!sending && !video.paused) {
    sending = true;
    off.width = 640; off.height = Math.round(640 * video.videoHeight / video.videoWidth) || 480;
    octx.drawImage(video, 0, 0, off.width, off.height);
    off.toBlob(b => b.arrayBuffer().then(buf => { ws.send(buf); }), 'image/jpeg', 0.6);
  }
  setTimeout(pump, 100);   // ~10 fps upstream; backend sets the real pace
}
function onResult(r) {
  sending = false;
  const sx = overlay.width / 640, sy = overlay.height / (off.height || 480);
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  for (const d of r.detections) {
    const [x1, y1, x2, y2] = d.box; const haz = d.closing && d.distance === 'near';
    ctx.lineWidth = haz ? 4 : 2; ctx.strokeStyle = haz ? '#ff5c5c' : d.distance === 'near' ? '#f2b134' : '#5ad1a3';
    ctx.strokeRect(x1 * sx, y1 * sy, (x2 - x1) * sx, (y2 - y1) * sy);
    ctx.fillStyle = ctx.strokeStyle; ctx.font = '14px system-ui';
    ctx.fillText(`${d.label} · ${d.side} · ${d.distance}${d.closing ? ' · closing' : ''}`, x1 * sx + 4, y1 * sy - 6);
  }
  $('stage').classList.toggle('hazard', r.hazard);
  if (r.hazard) hazardTint();
  $('hud').textContent = `${r.fps} fps · ${r.detections.length} objects`;
  if (r.caption) setCaption(r.caption);
  if (r.say) speak(r.say.text, r.say.side, r.say.urgency, r.say.audio_url);   // the speech manager shows + logs what it says
}

// ---------- ask, persona, mute -------------------------------------------------------
$('askform').onsubmit = async e => {
  e.preventDefault(); const q = $('q').value.trim(); if (!q) return; $('q').value = '';
  logItem('you', q);
  // The question takes the floor: chatter stops now; a hazard already being spoken may finish its sentence.
  awaitingAnswer = true;
  if (playing && playing.prio < PRIO.urgent) silence();
  show('Looking…', 'info');
  let a;
  try {
    a = await (await fetch('/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: q }) })).json();
  } catch (err) {
    a = { text: "Sorry, I couldn't reach the assistant.", clip_url: null };
  } finally {
    awaitingAnswer = false;
  }
  show(a.text, 'info'); logItem('answer', a.text, a.clip_url);
  if (!speak(a.text, null, 'answer', a.audio_url)) flushHeld();         // muted → still release any held hazard
};
$('persona').onchange = e => fetch('/persona', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ persona: e.target.value }) });
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '🔇 muted' : '🔊 sound on'; if (muted) stopAll(); };
$('start').onclick = () => start().catch(err => { $('status').textContent = 'camera error: ' + err.message; });
// "Use video": pick a first-person clip from disk; or open the page with ?video=/clips/name.mp4
$('usevideo').onclick = () => $('vfile').click();
$('pausebtn').onclick = togglePause;
$('stopbtn').onclick = stopSession;
$('vfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) start(URL.createObjectURL(f)).catch(err => { $('status').textContent = 'video error: ' + err.message; }); };
const qVideo = new URLSearchParams(location.search).get('video');
if (qVideo) { $('status').textContent = 'click anywhere to start the video'; document.addEventListener('click', () => start(qVideo).catch(err => { $('status').textContent = 'video error: ' + err.message; }), { once: true }); }

// pull captions written by the slow path even when nothing new is said
setInterval(async () => {
  const s = await (await fetch('/state')).json();
  for (const item of s.log.filter(i => i.kind === 'caption').slice(-1)) {
    if (!window._lastCap || item.t > window._lastCap) { window._lastCap = item.t; setCaption(item.text); logItem('seen', item.text, item.clip_url); }
  }
}, 2000);
</script>
</body>
</html>
